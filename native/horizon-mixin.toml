# Minecraft Misogynist Unexpansion for Horizon, built by its launcher: `horizon-launcher native-build`.
# Mobs taken out (set in removed_mobs.cfg), the original farm animals and their old babies.
# The recipes and items are the content mod `misogynist_unexpansion`.
[mod]
id = "misogynist_unexpansion_native"
version = "0.12.1"

[compatibility]
horizon_revision = "1fe4e6fe0252c44efd41d882daee0468389f7d5f"

[api]
path = "api"

# The Key Binds screen's search finds a binding by its key too (Controlling's search by key, by
# Jaredlll08, MIT). Its filter compares the query with each binding's translated name: while that
# screen lays itself out, the name carries the binding's key as well.
[[module]]
id = "keybind-search-state"
file = "crates/horizon-client-core/src/lib.rs"
name = "keybind_search"
visibility = "pub"
source = "keybind_search_state.rs"

[[injection]]
id = "keybind-search-arm"
kind = "HEAD"
target = "horizon_client_render::options_ui::OptionsUi::layout"
helper = "keybind_search.rs"
bindings = [
  { name = "ui", ty = "&crate::options_ui::OptionsUi", value = "&*self" },
  { name = "s", ty = "&crate::settings::Settings", value = "s" },
]

[[injection]]
id = "keybind-search-name"
kind = "RETURN"
target = "horizon_client_core::lang::get"
helper = "keybind_name.rs"
bindings = [
  { name = "key", ty = "&str", value = "key" },
  { name = "value", ty = "String", value = "$value" },
]

# Powder snow is walked on, leather boots or not: its collision asks whether the player wears them.
[[injection]]
id = "powder-snow-walk"
kind = "RETURN"
target = "horizon_client_lib::motion::PlayerMotion::powder_snow_subject"
helper = "powder_snow_walk.rs"
bindings = [
  { name = "value", ty = "crate::collisions::PowderSnowSubject", value = "$value" },
]

# No sculk patches, loose sculk veins, leaf litter, wildflowers or pink petals in new terrain. Each feature tree the world generator
# resolves is expanded, its sculk patches given no rounds of spreading or growth and its sculk-vein
# growths allowed on no face, then decoded: neither places anything.
[[module]]
id = "no-sculk-edit"
file = "crates/horizon-world/src/lib.rs"
name = "no_sculk"
visibility = "pub(crate)"
source = "no_sculk_edit.rs"

[[injection]]
id = "no-sculk-placed"
kind = "HEAD"
cancellable = true
target = "horizon_world::worldgen::feature_catalog::FeatureCatalog::placed_with_optional_blocks"
helper = "no_sculk_placed.rs"
bindings = [
  { name = "catalog", ty = "&FeatureCatalog", value = "&*self" },
  { name = "json", ty = "&str", value = "json" },
  { name = "blocks", ty = "Option<&FeatureBlockBindings<'_>>", value = "blocks" },
]

[[injection]]
id = "no-sculk-feature"
kind = "HEAD"
cancellable = true
target = "horizon_world::worldgen::feature_catalog::FeatureCatalog::feature_with_optional_blocks"
helper = "no_sculk_feature.rs"
bindings = [
  { name = "catalog", ty = "&FeatureCatalog", value = "&*self" },
  { name = "json", ty = "&str", value = "json" },
  { name = "blocks", ty = "Option<&FeatureBlockBindings<'_>>", value = "blocks" },
]

# Animals make their classic sounds: no sound variants, and babies sound as they did (grown sounds at
# a baby's voice). Every sound a pig, cow, chicken, wolf or cat makes is asked of this function.
[[injection]]
id = "classic-sounds"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::mobs::finalize::variant_sound"
helper = "classic_sounds.rs"
bindings = [
  { name = "m", ty = "&crate::mobs::Mob", value = "m" },
  { name = "kind", ty = "&str", value = "kind" },
]

# Wolves only the original colour, farm animals only temperate: spawned, loaded from a save, or as a
# server reports them (so they look right on a server without this mod too).
[[injection]]
id = "original-variants"
kind = "RETURN"
target = "horizon_client_lib::mobs::finalize::variant_index"
helper = "original_variants.rs"
bindings = [
  { name = "value", ty = "u8", value = "$value" },
  { name = "s", ty = "crate::mobs::Species", value = "s" },
]

# Enchanting in single player costs half the level asked (a server's players: `enchant.rs`): the
# level and the offer's cost before the click, and the rest of the half taken after it when it
# enchanted.
[[module]]
id = "half-level-enchant-state"
file = "crates/horizon-client/src/game/stations.rs"
name = "unexpansion_enchant"
visibility = "pub(crate)"
source = "half_level_enchant_state.rs"

[[injection]]
id = "half-level-enchant-before"
kind = "HEAD"
target = "horizon_client::game::stations::Game<'_>::click_enchant"
helper = "half_level_enchant.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "half-level-enchant-after"
kind = "RETURN"
target = "horizon_client::game::stations::Game<'_>::click_enchant"
helper = "half_level_enchant_after.rs"
bindings = [
  { name = "value", ty = "()", value = "$value" },
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Kelp only in warm, lukewarm and frozen oceans: the world generator reads each biome's features
# through this, and the ordinary and cold oceans' kelp moves to the warm and frozen ones.
[[injection]]
id = "kelp-biomes"
kind = "RETURN"
target = "horizon_world::worldgen::generator::GeneratorData::biome_json"
helper = "kelp_biomes.rs"
bindings = [
  { name = "value", ty = "&str", value = "$value" },
]

# Powder snow slows what walks on it, as soul sand does.
[[injection]]
id = "powder-snow-slow"
kind = "RETURN"
target = "horizon_world::movement_properties::MovementProperties<'_>::bind"
helper = "powder_snow_slow.rs"
bindings = [
  { name = "value", ty = "io::Result<BoundMovementProperties>", value = "$value" },
  { name = "props", ty = "&MovementProperties<'_>", value = "&*self" },
]

# Standing on powder snow freezes you after 15 seconds (single player and a server's players).
[[injection]]
id = "powder-snow-cold"
kind = "HEAD"
target = "horizon_client_lib::motion::MotionWorld<'_,'_,'_>::effects_from_blocks"
helper = "powder_snow_cold.rs"
bindings = [
  { name = "world", ty = "&mut MotionWorld<'_, '_, '_>", value = "&mut *self" },
  { name = "damage_only", ty = "bool", value = "damage_only" },
]
